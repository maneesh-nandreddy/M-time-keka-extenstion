<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Keka Time Tracker</title>
  <link rel="stylesheet" href="popup.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="title">⏰ Keka Effective Hours</div>
      <div class="sub">🎯 Target: 8h 15m</div>
    </div>

    <div class="profile-section">
      <div id="profilePic" class="avatar"></div>
      <div class="profile-info">
        <div id="profileName" class="pname">Hi —</div>
        <div id="profileRole" class="prole">Role —</div>
      </div>
    </div>

    <div class="metrics">
      <div id="worked" class="metric">🕓 Worked: —</div>
      <div id="remaining" class="metric">⏳ Remaining: —</div>
      <div id="gross" class="metric">🧩 Gross: —</div>
      <div id="stayTill" class="metric small">🏢 Stay Till: —</div>
    </div>

    <div class="progress-container">
      <div class="progress-header">
        <span class="progress-title">Effective Progress</span>
        <span id="progressLabel" class="progress-percentage">0%</span>
      </div>
      <div id="progressBar" class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div class="actions">
      <button id="kekaLogs" class="btn-icon" title="Attendance Logs">
        <img src="../icons/keka.png" alt="Keka" />
      </button>
      <button id="playGame" class="btn ghost flex-grow">🎮 Relax</button>
    </div>

    <div id="gameOverlay" class="game-overlay">
      <button id="closeGame" class="game-close">&times;</button>
      <div id="gameHeader" class="game-header" style="display: none">
        <div id="gameScore">Score: 0</div>
        <div id="gameTimer">Time: 30s</div>
      </div>
      <div id="gameArea" class="game-area">
        <div id="gameStartScreen" class="game-menu">
          <h3>Choose a Game</h3>
          <div class="game-options">
            <button id="startG1" class="btn">Game 1: Catch ⏰</button>
            <button id="startG2" class="btn ghost">Game 2: Bounce ⏰</button>
            <button id="startG3" class="btn ghost">Game 3: Tango 🔆</button>
          </div>
          <p class="game-hint">G1: Click them! | G2: Mouse block! | G3: Logic puzzle!</p>
        </div>
        <div id="gameTarget" class="game-target" style="display: none">⏰</div>
        <div id="gamePaddle" class="game-paddle" style="display: none"></div>

        <!-- Tango Game Screen -->
        <div id="tangoScreen" class="game-menu tango-screen" style="display: none">
          <div class="tango-header">
            <h3>🔆 Tango 🌙</h3>
            <div id="tangoTimer" class="tango-timer">0:00</div>
          </div>
          <div id="tangoGrid" class="tango-grid"></div>
          <div id="tangoStatus" class="tango-status"></div>
          <div class="game-options tango-actions">
            <button id="tangoNew" class="btn">🎲 New Puzzle</button>
            <button id="tangoBack" class="btn ghost">🏠 Menu</button>
          </div>
        </div>
        
        <!-- Custom Game Over Screen -->
        <div id="gameOverScreen" class="game-menu" style="display: none">
          <h2 style="color: var(--danger); margin-bottom: 10px;">GAME OVER</h2>
          <div id="finalScore" style="font-size: 24px; font-weight: 700; margin-bottom: 20px;">Score: 0</div>
          <div class="game-options">
            <button id="restartGame" class="btn">🔄 Try Again</button>
            <button id="backToMenu" class="btn ghost">🏠 Main Menu</button>
          </div>
        </div>
      </div>
    </div>

    <div id="debug" class="debug" style="display: none"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
